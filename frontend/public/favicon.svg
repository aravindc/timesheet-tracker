<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <!-- Clock face -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="2"/>
  <!-- Hour hand -->
  <line x1="16" y1="16" x2="11" y2="10" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="16" y1="16" x2="21" y2="12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.8" fill="white"/>
  <!-- Tick marks -->
  <line x1="16" y1="7" x2="16" y2="9" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="16" y2="25" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="16" x2="9" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="16" x2="25" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
