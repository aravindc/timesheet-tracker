<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Background pill -->
  <rect width="200" height="60" rx="12" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Clock icon -->
  <circle cx="34" cy="30" r="16" fill="white" fill-opacity="0.15"/>
  <circle cx="34" cy="30" r="12" fill="none" stroke="white" stroke-width="2"/>
  <!-- Hour hand -->
  <line x1="34" y1="30" x2="29" y2="24" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="34" y1="30" x2="40" y2="26" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="34" cy="30" r="1.8" fill="white"/>
  <!-- Tick marks -->
  <line x1="34" y1="19" x2="34" y2="21.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="38.5" x2="34" y2="41" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="30" x2="25.5" y2="30" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42.5" y1="30" x2="45" y2="30" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- App name -->
  <text x="60" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="0.5">TIMESHEET</text>
  <text x="60" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.8)" letter-spacing="2">TRACKER</text>
</svg>
