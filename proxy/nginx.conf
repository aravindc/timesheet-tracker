server {
    listen 80;
    server_name localhost;

    # Rule for the Go API backend
    # All requests starting with /api/ will be forwarded to the secshare-app service
    location /api/ {
        # The service name 'secshare-app' is used because Docker Compose provides DNS resolution
        proxy_pass http://backend:8080;
        
        # Standard headers to pass along client information to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;        
    }

    # Default rule for the Angular UI frontend
    # All other requests will be forwarded to the secshare-ui service
    location / {
        proxy_pass http://frontend:80;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}